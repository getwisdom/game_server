<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover">
<title>台麻游戏</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(160deg,#0f0c29,#302b63,#24243e);min-height:100vh;min-height:100dvh;display:flex;justify-content:center;color:#fff;padding:8px 0 20px 0;touch-action:manipulation;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
  .gc{width:100%;max-width:420px;padding:10px 12px;}
  h1{text-align:center;font-size:18px;font-weight:700;background:linear-gradient(90deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:2px;}
  .sub{text-align:center;color:rgba(255,255,255,0.18);font-size:9px;margin-bottom:8px;}
  .btn-row{display:flex;gap:5px;margin-bottom:8px;}
  .btn-row .btn{flex:1;padding:10px 3px;border-radius:8px;font-size:12px;font-weight:600;text-align:center;border:none;cursor:pointer;transition:all 0.1s;white-space:nowrap;position:relative;overflow:hidden;}
  .btn-row .btn:not(:disabled):after{content:'';position:absolute;inset:0;border-radius:8px;pointer-events:none;opacity:0;transition:opacity 0.15s;background:rgba(255,255,255,0.05);}
  .btn-row .btn:not(:disabled).fb:after{opacity:1;}
  .btn-row .btn:active{transform:scale(0.95);opacity:0.85;}
  .btn-a{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
  .btn-l{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;}
  .btn-p{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#1a1a2e;}
  .btn-n{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#1a1a2e;}
  .btn-row .btn:disabled{opacity:0.2;transform:none!important;}
  .pb{margin-top:4px;}
  .pblock{background:rgba(255,255,255,0.06);border-radius:10px;padding:8px 10px;margin-bottom:6px;border:1px solid rgba(255,255,255,0.12);}
  .pblock.me{border-color:#f7971e;box-shadow:0 0 8px rgba(247,151,30,0.2);}
  .pheader{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .pheader .pname{font-size:13px;font-weight:600;}
  .pheader .pscore{font-size:12px;color:rgba(255,255,255,0.45);}
  .pheader .pscore .n{color:#ffd200;font-weight:600;}
  .pheader .pscore .n2{color:#6bcb77;font-weight:600;}
  .pheader .tag-me{font-size:10px;color:rgba(255,255,255,0.3);}
  .ptag{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;}
  .grid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;}
  .cell{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;cursor:pointer;transition:all 0.08s;border:1px solid rgba(255,255,255,0.06);-webkit-user-select:none;user-select:none;position:relative;overflow:hidden;}
  .cell:not(.locked):active{transform:scale(0.9);}
  .cell:not(.locked).fb:after{content:'';position:absolute;inset:0;border-radius:5px;background:rgba(255,255,255,0.08);pointer-events:none;}
  .cell.bk{background:rgba(255,255,255,0.85);color:#1a1a2e;border-color:rgba(255,255,255,0.3);}
  .cell.gr{background:rgba(100,220,100,0.22);color:#64dc64;border-color:rgba(100,220,100,0.18);}
  .cell.gy{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.3);border-color:rgba(255,255,255,0.05);}
  .cell.rd{background:rgba(255,100,100,0.15);color:#ff6464;border-color:rgba(255,100,100,0.15);}
  .cell.yl{background:rgba(255,220,50,0.15);color:#ffdc32;border-color:rgba(255,220,50,0.15);}
  .cell.em{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.3);border-color:rgba(255,255,255,0.1);}
  .cell.locked{cursor:default;}.cell.locked:active{transform:none;}.cell.locked.fb:after{display:none;}
  .msg{padding:6px 8px;border-radius:6px;margin:5px 0;font-size:12px;line-height:1.3;}
  .msg.info{background:rgba(100,180,255,0.05);border-left:2px solid #64b4ff;}
  .msg.success{background:rgba(100,220,100,0.05);border-left:2px solid #64dc64;}
  .status-bar{text-align:center;font-size:11px;color:rgba(255,255,255,0.25);padding:4px 0;margin-bottom:6px;}
  .hdr{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px;}
  .hdr-tag{font-size:11px;padding:2px 8px;border-radius:4px;}
  .hdr-tag.hist{background:rgba(255,200,50,0.15);color:#ffc832;}
  .hdr-tag.rc{background:rgba(100,180,255,0.15);color:#64b4ff;}
  #lightbox{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;cursor:pointer;}
  #lightbox img{max-width:95vw;max-height:95vh;border-radius:8px;}
  .pheader .pscore .st{color:#f7971e;font-weight:700;font-size:13px;}
  @keyframes fbGlow{0%{box-shadow:0 0 0 0 rgba(255,255,255,0.3)}100%{box-shadow:0 0 8px 4px rgba(255,255,255,0)}}
  .fb-glow{animation:fbGlow 0.25s ease-out;}
</style>
</head>
<body>
<div class="gc" id="app">
  <h1>🎮 台麻游戏</h1>
  <p class="sub">当局 -5+绿数+红数-2×黄数 | 全绿时他人分=|全绿分|</p>
  <div id="lobbyUI">
    <div style="padding:20px 0">
      <div style="font-size:14px;font-weight:600;margin-bottom:8px;color:rgba(255,255,255,0.5)">你的昵称</div>
      <input id="nickInput" value="" maxlength="6" style="width:100%;padding:12px;border-radius:10px;font-size:16px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;outline:none;text-align:center" placeholder="输入昵称">
      <div style="height:10px"></div>
      <select id="modeSel" style="width:100%;padding:12px;border-radius:10px;font-size:14px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;outline:none;appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center;">
        <option value="mode2">4人模式</option>
        <option value="mode1">3人模式</option>
        <option value="mode3">5人模式</option>
      </select>
      <div style="height:10px"></div>
      <div style="font-size:14px;font-weight:600;margin-bottom:6px;color:rgba(255,255,255,0.5)">倍率</div>
      <input id="multiInput" value="" inputmode="decimal" style="width:100%;padding:12px;border-radius:10px;font-size:16px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;outline:none;text-align:center" placeholder="例: 1 或 0.5 或 2">
      <div style="height:10px"></div>
      <button onclick="fb();createRoom()" style="width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;cursor:pointer;transition:all 0.1s">🏠 创建房间</button>
      <div style="display:flex;align-items:center;gap:12px;margin:14px 0">
        <div style="flex:1;height:1px;background:rgba(255,255,255,0.08)"></div>
        <span style="font-size:12px;color:rgba(255,255,255,0.2)">或</span>
        <div style="flex:1;height:1px;background:rgba(255,255,255,0.08)"></div>
      </div>
      <div style="font-size:14px;font-weight:600;margin-bottom:8px;color:rgba(255,255,255,0.5)">输入房间号加入</div>
      <input id="codeInput" value="" maxlength="4" inputmode="numeric" pattern="[0-9]*" style="width:100%;padding:12px;border-radius:10px;font-size:20px;font-weight:700;letter-spacing:4px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;outline:none;text-align:center" placeholder="房间号">
      <div style="height:10px"></div>
      <button onclick="fb();joinRoom()" style="width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:700;background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;border:none;cursor:pointer;transition:all 0.1s">🚪 加入房间</button>
      <div id="lobbyMsg" style="margin-top:10px;text-align:center;font-size:12px;color:rgba(255,180,100,0.6)"></div>
    </div>
  </div>
  <div id="gameUI" style="display:none">
    <div class="status-bar" id="statusBar"></div>
    <div class="btn-row">
      <button class="btn btn-a" id="btnA" onclick="fb();send('assign')" disabled>分配</button>
      <button class="btn btn-l" id="btnL" onclick="fb();send('light')" disabled>亮号</button>
      <button class="btn btn-p" id="btnP" onclick="fb();if(state&&state.historyPos===-1)ss('上局_第'+(state?.round||0)+'局');send('prev')" disabled>上局</button>
      <button class="btn btn-n" id="btnN" onclick="fb();if(state&&state.historyPos===-1)ss('下局_第'+(state?.round||0)+'局');send('next')" disabled>下局</button>
    </div>
    <div id="gameArea"></div>
    <div id="galleryBtn" style="text-align:center;margin:6px 0;display:none">
      <button onclick="toggleGallery()" style="background:none;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.4);padding:6px 16px;border-radius:6px;font-size:12px;cursor:pointer">📷 查看截图 (<span id="ssCount">0</span>)</button>
    </div>
    <div id="gallery" style="display:none;padding:4px 0"></div>
  </div>
  <div id="lightbox" onclick="this.style.display='none'"><img id="lbImg" src=""></div>
</div>

<script>
const COLORS=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#a78bfa'];
const DFLT=['玩家一','玩家二','玩家三','玩家四','玩家五'];
let ws=null,myIndex=-1,state=null,roomCode=null,myMulti=1,myName='';
const LS_NICK='taiMaNick',LS_MULTI='taiMaMulti';
let reconnectAttempts=0,reconnectTimer=null,manualClose=false;

function getWsUrl(){const p=window.location;return(p.protocol==='https:'?'wss:':'ws:')+'//'+p.host;}

// ====== 触控反馈 ======
function fb(el){
  try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
  if(!el)el=event?.target;
  if(el&&typeof el.className==='string'&&!el.disabled){
    el.classList.add('fb-glow');
    setTimeout(()=>el.classList.remove('fb-glow'),260);
  }
}
// 给所有格子加反馈
function fbCell(el){
  try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}
  if(el&&typeof el.className==='string'){
    el.classList.add('fb-glow');
    setTimeout(()=>el.classList.remove('fb-glow'),260);
  }
}

function connect(){
  const saved=localStorage.getItem(LS_NICK);
  if(saved)document.getElementById('nickInput').value=saved;

  ws=new WebSocket(getWsUrl());
  ws.onopen=()=>{
    reconnectAttempts=0;
    document.getElementById('lobbyMsg').textContent='';
    // 重连成功，尝试重新加入之前的房间
    if(roomCode&&myName){
      send('joinRoom',{roomCode,name:myName});
    }
  };
  ws.onmessage=e=>handleMsg(JSON.parse(e.data));
  ws.onclose=()=>{
    if(manualClose)return;
    if(document.getElementById('gameUI').style.display!=='none'){
      document.getElementById('statusBar').textContent='⚠️ 连接断开，正在重连...';
    }
    scheduleReconnect();
  };
}

function scheduleReconnect(){
  if(reconnectTimer)return;
  reconnectAttempts++;
  reconnectTimer=setTimeout(()=>{
    reconnectTimer=null;
    connect();
  },2000);
}

function send(m,ex){if(!ws||ws.readyState!==1)return;ws.send(JSON.stringify(typeof m==='string'?Object.assign({type:m},ex||{}):m));}

function handleMsg(msg){
  switch(msg.type){
    case 'joined':
      myIndex=msg.playerIndex;roomCode=msg.roomCode;state=msg.state;
      const v=parseFloat(document.getElementById('multiInput').value)||1;
      myMulti=v;localStorage.setItem(LS_MULTI,String(v));
      document.getElementById('lobbyUI').style.display='none';
      document.getElementById('gameUI').style.display='';
      renderState();window.scrollTo(0,0);
      break;
    case 'state':
      state=msg.state;
      if(document.getElementById('gameUI').style.display!=='none')renderState();
      break;
    case 'err':alert(msg.msg);break;
  }
}

function createRoom(){
  myName=document.getElementById('nickInput').value.trim()||'玩家';
  localStorage.setItem(LS_NICK,myName);
  const mode=document.getElementById('modeSel').value;
  const m=parseFloat(document.getElementById('multiInput').value)||1;
  localStorage.setItem(LS_MULTI,String(m));
  send('createRoom',{name:myName,mode,multi:m});
}
function joinRoom(){
  myName=document.getElementById('nickInput').value.trim()||'玩家';
  localStorage.setItem(LS_NICK,myName);
  const code=document.getElementById('codeInput').value.trim();
  if(!code){document.getElementById('lobbyMsg').textContent='请输入房间号';return;}
  send('joinRoom',{roomCode:code,name:myName});
}

function renderState(){
  if(!state)return;const area=document.getElementById('gameArea');
  const myName=state.ply[myIndex]?.n||'';
  const inHistory=state.historyPos>=0;
  const ag=isAllGreen(state,myIndex);
  document.getElementById('statusBar').innerHTML=`<span class="dot">🟢</span> ${myName} <span style="color:rgba(255,255,255,0.2);margin:0 6px">|</span> <span style="color:${COLORS[myIndex%5]||'#ffd200'}">房间 ${roomCode}</span> ${state.multi&&state.multi!==1?`<span style="color:rgba(255,255,255,0.15)">倍率${state.multi}</span>`:''}`;
  const lv=state.lightVotes||[];
  const isVoting=!state.lit&&state.done&&lv.length>0&&!inHistory;
  document.getElementById('btnA').disabled=state.done&&!state.lit||inHistory||(state.lit&&!ag);
  document.getElementById('btnL').disabled=!state.done||state.lit||lv.length>=2||inHistory;
  document.getElementById('btnP').disabled=state.history.length===0||state.historyPos===0;
  document.getElementById('btnN').disabled=state.historyPos===-1;
  if(isVoting){
    let h='<div style="text-align:center;padding:20px 0">';
    h+=`<div style="font-size:15px;font-weight:600;color:#f093fb;margin-bottom:6px">👆 亮号确认中</div>`;
    h+=`<div style="font-size:13px;color:rgba(255,255,255,0.5)">${lv.length}/2 玩家已确认亮号</div>`;
    h+=`<div style="margin-top:4px;font-size:11px;color:rgba(255,255,255,0.2)">需要2位不同玩家按「亮号」按钮</div>`;
    for(let i=0;i<state.ply.length;i++){const tc=COLORS[i%5],voted=lv.includes(i),im=myIndex===i;
      h+=`<div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 0;${voted?'opacity:0.5':''}"><div class="ptag" style="background:${tc}30;color:${tc}">${i+1}</div><span style="font-size:13px;font-weight:500">${state.ply[i].n}</span><span style="font-size:13px">${voted?'✅ 已确认':(im?'👇 等你就绪':'⏳')}</span></div>`;}
    h+='</div>';area.innerHTML=h;return;
  }
  let html='';
  if(inHistory)html+=`<div class="hdr"><span class="hdr-tag hist">📜 历史状态 - 第${state.round}局</span></div>`;
  html+='<div class="pb">';
  const rs=calcScores(state.ply,state.pcs);
  const order=Array.from({length:state.ply.length},(_,i)=>i).filter(i=>i!==myIndex);order.unshift(myIndex);
  for(let ii=0;ii<order.length;ii++){
    const i=order[ii],p=state.ply[i],tc=COLORS[i%5],need=state.pcs[i]||0,isMe=myIndex===i;
    const cum=(state.cum[i]||0)+rs[i];
    const showST=state.lit&&state.multi;
    const stVal=showST?Math.round(cum*state.multi*100)/100:null;
    html+=`<div class="pblock${isMe?' me':''}"><div class="pheader"><div class="ptag" style="background:${tc}30;color:${tc}">${i+1}</div><div class="pname" style="color:${tc}">${p.n}</div>${isMe?'<span class="tag-me">👈 你</span>':''}<div class="pscore">${(state.lit||isMe)?`当局: <span class="n">${rs[i]>=0?'+'+rs[i]:rs[i]}</span>`:''}</div><div class="pscore">累计: <span class="n2">${cum}</span>${stVal!==null?` <span class="st">¥${stVal}</span>`:''}</div></div><div class="grid">`;
    for(let si=0;si<need+4;si++){
      const val=p.s[si],cl=p.cs[si]||'em';let d='·';
      if(val!==undefined&&val!==null){if(si<need)d=(state.lit||isMe)?val:'?';else d=val;}
      const canClick=state.done&&isMe&&!inHistory;
      html+=`<div class="cell ${cl}${canClick?'':' locked'}" onclick="${canClick?'fbCell(this);send(\'toggleCell\',{playerIndex:'+i+',cellIndex:'+si+'})':''}">${d}</div>`;
    }
    html+='</div></div>';
  }
  html+='</div>';
  html+=`<div style="text-align:center;padding:4px 0;font-size:11px;color:rgba(255,255,255,0.3)">🎲 已分配 ${state.assignCount} 次</div>`;
  let msg=inHistory?'⬆️ 点「上局」「下局」浏览历史':!state.done?'点击「分配」发牌':!state.lit?'需2位玩家按「亮号」':ag?'点「分配」下一轮':'需要全绿玩家点「分配」下一轮';
  html+=`<div class="msg ${inHistory?'info':!state.done?'info':'success'}">${msg}</div>`;
  area.innerHTML=html;
}

function calcScores(ply,pcs){
  // 新规则：每玩家得分 = -5 + 绿数字数 + 红0数 - 2×黄0数
  // 当某个玩家全绿时，其他玩家的分数 = |该全绿玩家的分数|
  const allGreen=[],st=[];
  for(let i=0;i<ply.length;i++){const p=ply[i];const need=pcs[i]||0;let gr=0,rd=0,yl=0,hB=false;
    for(let si=0;si<need+4;si++){if(si<need){if(p.cs[si]==='bk'){hB=true;}else if(p.cs[si]==='gr'){gr++;}}else{if(p.cs[si]==='rd'){rd++;}else if(p.cs[si]==='yl'){yl++;}}}
    allGreen[i]=!hB;st[i]={gr,rd,yl};}
  const r=[];
  for(let i=0;i<ply.length;i++){r[i]=-5+st[i].gr+st[i].rd-2*st[i].yl;}
  for(let i=0;i<ply.length;i++){
    if(allGreen[i]){const ag=r[i];for(let j=0;j<ply.length;j++){if(j!==i)r[j]=Math.abs(ag);}break;}
  }
  return r;}

function isAllGreen(st,pi){const p=st.ply[pi];const need=st.pcs[pi]||0;for(let si=0;si<need;si++){if(p.cs[si]==='bk')return false;}return true;}

// ====== 截图 ======
let gameSS=[],_ssRound=null;
function ss(msg){try{
  const rnd=state?.round;
  if(_ssRound===rnd)return; // 每轮只截一次
  _ssRound=rnd;
  const el=document.getElementById('gameUI');if(!el||!window.html2canvas)return;
  html2canvas(el,{scale:2,backgroundColor:'#1a1a2e',useCORS:true,allowTaint:true,logging:false}).then(c=>{
    const url=c.toDataURL('image/png');
    gameSS=[{msg,url,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}]; // 只保留最后一次
    document.getElementById('ssCount').textContent=1;
    document.getElementById('galleryBtn').style.display='';
  }).catch(()=>{});}catch(e){}
}
function toggleGallery(){const g=document.getElementById('gallery');g.style.display=g.style.display==='none'?'':'none';renderGallery();}
function renderGallery(){const g=document.getElementById('gallery');if(g.style.display==='none')return;
  let h='<div style="font-size:11px;color:rgba(255,255,255,0.25);margin-bottom:6px">点击截图放大，再点关闭</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">';
  for(let i=gameSS.length-1;i>=0;i--){const s=gameSS[i];
    h+=`<div style="cursor:pointer;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,0.1)" onclick="showSS('${s.url}')"><img src="${s.url}" style="width:100%;display:block"><div style="font-size:9px;color:rgba(255,255,255,0.3);text-align:center;padding:2px">${s.msg} ${s.time}</div></div>`;}
  h+='</div>';g.innerHTML=h;}
function showSS(url){document.getElementById('lbImg').src=url;document.getElementById('lightbox').style.display='flex';}

connect();
</script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
</html>
